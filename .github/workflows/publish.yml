name: Publish core and Angular

on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Validate strict v-prefixed SemVer before preparation
        id: release
        run: node scripts/prepare-release.mjs --validate
      - name: Resolve tag commit
        run: echo "RELEASE_SHA=$(git rev-parse 'HEAD^{commit}')" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: npm install --global npm@11.21.2
      - run: node scripts/prepare-release.mjs
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:lib
      - run: pnpm --filter @raniagus/subjects-graph-angular build
      - run: pnpm --filter @raniagus/subjects-graph-angular test
      - run: pnpm --filter subjects-graph-angular-example build
      - name: Pack both public packages
        run: |
          pnpm pack --out /tmp/core.tgz
          pnpm --dir packages/angular pack --out /tmp/angular.tgz
      - name: Inspect both archives and publish in dependency order
        run: node scripts/publish-release.mjs /tmp/core.tgz /tmp/angular.tgz
      - name: Update latest main after both publications succeed
        if: steps.release.outputs.dist_tag == 'latest'
        run: |
          # Use the tag's release helper even when main has moved.
          cp scripts/commit-release.mjs /tmp/commit-release.mjs
          cp scripts/prepare-release.mjs /tmp/prepare-release.mjs
          git fetch origin main
          git checkout --force -B release-main origin/main
          node /tmp/commit-release.mjs
          git push origin HEAD:main

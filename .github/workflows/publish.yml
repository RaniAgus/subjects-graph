name: Verify and publish npm package

on:
  push:
    branches: [main]
    tags: ['v[0-9]*', '[0-9]*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:lib

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - name: Install npm with Trusted Publishing support
        run: npm install --global npm@11.21.2
      - name: Prepare version from Git tag
        id: release
        run: node scripts/prepare-release.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Publish with npm Trusted Publishing
        run: npm publish --access public --tag "$NPM_DIST_TAG" --ignore-scripts=false
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}

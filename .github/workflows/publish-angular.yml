name: Verify and publish Angular adapter

on:
  push:
    branches: [main]
    tags: ['angular-v[0-9]*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - run: pnpm --filter @raniagus/subjects-graph-angular build
      - run: pnpm --filter @raniagus/subjects-graph-angular test

  publish:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/angular-v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:lib
      - run: npm install --global npm@11.21.2
      - name: Prepare independent adapter version
        id: release
        working-directory: packages/angular
        run: |
          export RELEASE_TAG="${ANGULAR_TAG#angular-}"
          node ../../scripts/prepare-release.mjs
        env:
          ANGULAR_TAG: ${{ github.ref_name }}
      - name: Pack Angular adapter
        working-directory: packages/angular
        run: pnpm pack --out /tmp/subjects-graph-angular.tgz
      - name: Publish Angular adapter
        working-directory: packages/angular
        run: npm publish /tmp/subjects-graph-angular.tgz --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ steps.release.outputs.dist_tag }}

name: Verify libraries and example

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build:lib

      - run: pnpm --filter @raniagus/subjects-graph-angular build
      - run: pnpm --filter @raniagus/subjects-graph-angular test
      - run: pnpm --filter subjects-graph-angular-example build
